<figure class="issue-cover"><img src="{{ issue.cover_url }}" alt="{{ issue.cover_alt }}" width="1200" height="630" decoding="async">{% if issue.image_file and issue.image_credit %}<figcaption>{% if issue.image_type == "generated" %}Illustration · {% endif %}{% if issue.image_source_url %}<a href="{{ issue.image_source_url }}" rel="noopener noreferrer">{{ issue.image_credit }}</a>{% else %}{{ issue.image_credit }}{% endif %}</figcaption>{% endif %}</figure>
