<article class="byte"><h2><a href="/stories/{{ story.slug }}">{{ story.title }}</a></h2><p>{{ story.byte }}</p>{% if story.image_file %}<a class="story-preview" href="/stories/{{ story.slug }}"><img src="{{ story.thumbnail_url }}" alt="{{ story.cover_alt }}" width="600" height="315" loading="lazy" decoding="async"></a>{% if story.image_type == "generated" %}<p class="small">Illustration · {{ story.image_credit or "Ship Bytes" }}</p>{% endif %}{% endif %}<p><strong>Why it matters:</strong> {{ story.why_it_matters }}</p>{% include 'story_links.html' %}</article>
