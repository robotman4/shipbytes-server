<article class="byte"><h2><a href="/stories/{{ story.slug }}">{{ story.title }}</a></h2><p>{{ story.byte }}</p><p><strong>Why it matters:</strong> {{ story.why_it_matters }}</p><p class="links">{% if story.source_type == 'external' %}<a href="/stories/{{ story.slug }}">Read more</a><span aria-hidden="true"> / </span><a href="{{ story.source_url }}" rel="noopener noreferrer">Source: {{ story.source_name }} ↗</a>{% else %}<a href="/stories/{{ story.slug }}">Read full story</a>{% endif %}</p></article>
